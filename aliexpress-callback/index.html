<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Autorización de AliExpress · EME USA</title>
<style>body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d1f24;background:#f6f7fa;margin:0}
main{max-width:560px;margin:40px auto;padding:0 16px}.ok{color:#2e7d32}.no{color:#c62828}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:#1d1f24;color:#fff;cursor:pointer}</style>
</head><body><main>
<h1>Autorización de AliExpress</h1>
<p id="estado">Comprobando…</p>
<p><button id="copiar" hidden>Copiar la dirección</button></p>
<p>Si la consola está esperando, basta con copiar la dirección de esta página: se canjea sola. El código caduca en unos 3 minutos.</p>
</main>
<script>
(function(){var q=new URLSearchParams(location.search),e=document.getElementById('estado'),b=document.getElementById('copiar');
if(q.get('code')){e.className='ok';e.textContent='AliExpress devolvió un código de autorización.';b.hidden=false;
b.onclick=function(){navigator.clipboard.writeText(location.href).then(function(){b.textContent='Dirección copiada';});};}
else{e.className='no';e.textContent='Esta dirección no trae código de autorización'+(q.get('error')?' ('+q.get('error')+')':'')+'.';}})();
</script></body></html>
